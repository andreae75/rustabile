[package]
name = "rustabile-winui"
version = "0.10.0"
edition = "2024"
description = "Rustabile con la finestra WinUI 3 e l'audio di Windows"
license = "MIT"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
rustabile-nucleo = { path = "../nucleo" }
rfd = "0.15"
trash = "5"
windows-reactor = "0.100"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Core",
    "Media_MediaProperties",
    "Media_Playback",
    "Storage_Streams",
    "Web_Http",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
