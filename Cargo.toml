[package]
name = "rustabile"
version = "0.5.0"
edition = "2024"
description = "Un mini lettore musicale per GNOME, semplice come i lettori di una volta"
license = "MIT"
authors = ["andreae75"]
repository = "https://github.com/andreae75/rustabile"

[dependencies]
gdk_x11 = { version = "0.11", package = "gdk4-x11" }
gst = { version = "0.25.4", package = "gstreamer" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
x11rb = "0.14.0"
